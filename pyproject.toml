[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "territory-assistant"
version = "0.1.0"
description = "Prototype multi-agents d'aide à l'analyse préliminaire des contraintes territoriales (portfolio)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kenneth Tagne" }]
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "pydantic>=2.6",
    "matplotlib>=3.8",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Mode LLM (facultatif) : SDK officiel Anthropic.
llm = ["anthropic>=2.0,<3"]
# Interface de démonstration (facultative).
ui = ["streamlit>=1.50"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
territory-assistant = "territory_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: tests plus longs (évaluation complète)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
